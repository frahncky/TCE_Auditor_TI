name: Build PDFs

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.tex'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    paths:
      - '**/*.tex'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main_teoria.tex
            main_questoes.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload apostilas
        uses: actions/upload-artifact@v4
        with:
          name: TCE-MA-Auditor-TI-2026
          path: |
            main_teoria.pdf
            main_questoes.pdf
